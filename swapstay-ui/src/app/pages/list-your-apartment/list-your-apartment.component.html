<section class="min-h-[80vh] bg-gray-50 px-4 py-12">
  <div class="max-w-3xl mx-auto bg-white p-8 rounded-2xl shadow-xl">

    <h1 class="text-3xl font-bold text-gray-900 mb-2">
      List your apartment
    </h1>

    <p class="text-gray-600 mb-8">
      Share your home and start swapping with verified users.
    </p>

    <form class="space-y-6">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Apartment title
        </label>
        <input
          type="text"
          placeholder="Modern Sea Point Apartment"
          class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
        />
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            City
          </label>
          <input
            type="text"
            placeholder="Cape Town"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Suburb
          </label>
          <input
            type="text"
            placeholder="Sea Point"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Bedrooms
          </label>
          <input
            type="number"
            min="1"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Max guests
          </label>
          <input
            type="number"
            min="1"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Available from
          </label>
          <input
            type="date"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            Available to
          </label>
          <input
            type="date"
            class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:ring-2 focus:ring-indigo-500 focus:outline-none"
          />
        </div>
      </div>

      <div class="flex justify-end gap-3 pt-4">
        <button
          routerLink="/"
          type="button"
          class="px-6 py-3 rounded-lg border border-gray-300 hover:bg-gray-100 transition"
        >
          Cancel
        </button>

        <button
          type="submit"
          class="px-6 py-3 rounded-lg bg-indigo-600 text-white hover:bg-indigo-700 transition"
        >
          Publish listing
        </button>
      </div>

    </form>
  </div>
</section>
